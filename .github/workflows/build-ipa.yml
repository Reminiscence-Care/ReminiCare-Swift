name: Build Unsigned IPA

# Push a tag like v2.0.1 to build an unsigned IPA and attach it to a Release.
# Install it with AltStore, which signs it with the installer's own Apple ID.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test ReminiCareKit
        run: swift test --package-path ReminiCareKit

      - name: Build unsigned app
        run: |
          xcodebuild -project ReminiCare.xcodeproj -scheme ReminiCare \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Package .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/ReminiCare.app build/ipa/Payload/
          cd build/ipa && zip -qry "ReminiCare-${GITHUB_REF_NAME}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ReminiCare-IPA-${{ github.ref_name }}
          path: build/ipa/ReminiCare-${{ github.ref_name }}.ipa
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "build/ipa/ReminiCare-${GITHUB_REF_NAME}.ipa" \
            --title "ReminiCare Swift ${GITHUB_REF_NAME}" --generate-notes
